# This workflow builds .NET projects when a solution or project exists.
# Unity repositories may not contain a standalone .sln/.csproj at the repository root.
name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Locate solution or project
        id: locate
        shell: bash
        run: |
          file=$(find . -type f \( -name "*.sln" -o -name "*.csproj" \) -not -path "*/Library/*" -not -path "*/Temp/*" -print -quit || true)
          if [ -z "$file" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No .sln or .csproj found. Skipping .NET build because this repository may be a Unity project."
            exit 0
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "solution=$file" >> "$GITHUB_OUTPUT"
          echo "Found .NET project: $file"

      - name: Setup .NET
        if: steps.locate.outputs.found == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        if: steps.locate.outputs.found == 'true'
        run: dotnet restore "${{ steps.locate.outputs.solution }}"

      - name: Build
        if: steps.locate.outputs.found == 'true'
        run: dotnet build "${{ steps.locate.outputs.solution }}" --no-restore

      - name: Test
        if: steps.locate.outputs.found == 'true'
        run: dotnet test "${{ steps.locate.outputs.solution }}" --no-build --verbosity normal
